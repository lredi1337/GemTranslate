plugins {
    id 'com.android.application'
}

android {
    namespace 'app.waiter.orders'
    compileSdk 34

    defaultConfig {
        applicationId 'app.waiter.orders'
        minSdk 26
        targetSdk 34
        // Номер сборки GitHub Actions: каждая новая версия ставится поверх предыдущей
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Ключ подписи в репозитории не хранится: сборка берёт его из Secrets (как у ярлыка переводчика)
    signingConfigs {
        release {
            storeFile file(System.getenv('LAUNCHER_KEYSTORE') ?: 'launcher.jks')
            storePassword System.getenv('LAUNCHER_STORE_PASSWORD')
            keyAlias System.getenv('LAUNCHER_KEY_ALIAS') ?: 'launcher'
            keyPassword System.getenv('LAUNCHER_KEY_PASSWORD') ?: System.getenv('LAUNCHER_STORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
