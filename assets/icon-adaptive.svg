<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 768 768" width="768" height="768">
  <defs>
    
    <!-- Серая «страница» справа от косого разреза -->
    <clipPath id="page"><path d="M171.25 -128 L640 -128 L640 640 L415.75 640 Z"/></clipPath>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="-128" x2="0" y2="640">
      <stop offset="0" stop-color="#2F86F0"/>
      <stop offset="1" stop-color="#2373E4"/>
    </linearGradient>
    <linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="-128" y1="-128" x2="640" y2="640">
      <stop offset="0" stop-color="#E9ECEF"/>
      <stop offset="1" stop-color="#DADEE2"/>
    </linearGradient>
    <!-- Тень у сгиба: от разреза вглубь серой части -->
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="293" y1="256" x2="340" y2="240">
      <stop offset="0" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="-128" y="-128" width="768" height="768" fill="url(#blue)"/>
    <g clip-path="url(#page)">
      <rect x="-128" y="-128" width="768" height="768" fill="url(#paper)"/>
      <!-- Нижняя грань листа чуть темнее -->
      <path d="M83.6 -128 L640 422.5 L640 640 L415.75 640 L171.25 -128 Z" fill="#C9CED4" opacity="0.45"/>
      <rect x="-128" y="-128" width="768" height="768" fill="url(#fold)"/>
      <!-- 文 -->
      <path fill="none" stroke="#4E6175" stroke-width="21" stroke-linecap="butt" stroke-linejoin="round"
        d="M373 150 V192 M266 192 H474 M426 190 Q404 290 290 348 M316 190 Q352 292 470 336"/>
    </g>
    <!-- Ai -->
    <g fill="#FFFFFF">
      <!-- «A»: ножки 27 px, узкая верхушка, перекладина 20 px -->
      <path fill-rule="evenodd" d="M48 334 L94 190 L120 190 L166 334 L138 334 L127 300 L87 300 L76 334 Z M93.5 279 L120.5 279 L107 236.8 Z"/>
      <!-- «i» вплотную к «A» -->
      <rect x="178" y="238" width="27" height="96"/>
      <!-- Искра вместо точки над i -->
      <path d="M191.5 160 Q195 189 222 193 Q195 197 191.5 226 Q188 197 161 193 Q188 189 191.5 160 Z"/>
    </g>
  </g>
</svg>
