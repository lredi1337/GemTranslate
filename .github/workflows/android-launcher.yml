# Релиз: APK-ярлык «Переводчик» + файл переводчика для Gemini (translator-canvas.txt).
# Кнопки «Скачать» в README ведут на releases/latest/download/…, поэтому оба файла есть в каждом релизе
name: Android launcher APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'dist/**'
      - '.github/workflows/android-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Ключ подписи: из Secrets репозитория (если добавлены) или новый на эту сборку
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LAUNCHER_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/launcher.jks"
            echo "LAUNCHER_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/launcher.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias launcher -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Translator Launcher"
            echo "LAUNCHER_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "LAUNCHER_KEYSTORE=$RUNNER_TEMP/launcher.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK and add the Gemini file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Translator.apk
          cp dist/translator-canvas.html translator-canvas.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Translator-apk
          path: Translator.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-${{ github.run_number }}
          name: GemTranslate — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Translator.apk
            translator-canvas.txt
          body: |
            **translator-canvas.txt** — файл для Gemini: прикрепите его в новом чате и напишите
            «Сделай Canvas приложение из этого файла, ничего не меняя и не сокращая».

            **Translator.apk** — приложение-ярлык для телефона. При первом запуске вставьте ссылку на чат
            с переводчиком и включите службу «Переводчик: автооткрытие».

            Пошаговая инструкция — в README репозитория.
